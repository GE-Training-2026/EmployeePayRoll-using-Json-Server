<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Employee Payroll - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1 class="brand">Employee Payroll</h1>
    </div>
    <div class="header-right">
      <a class="btn btn-primary" href="add.html">Add Employee</a>
    </div>
  </header>

  <main class="container">
    <section class="stats-row">
      <div class="stat-card stat-purple">
        <div class="stat-title">Total Employees</div>
        <div class="stat-value" id="totalEmployees">0</div>
      </div>
      <div class="stat-card stat-green">
        <div class="stat-title">Total Payroll</div>
        <div class="stat-value">₹<span id="totalPayroll">0</span></div>
      </div>
      <div class="stat-card stat-orange">
        <div class="stat-title">Average Salary</div>
        <div class="stat-value">₹<span id="averageSalary">0</span></div>
      </div>
    </section>

    <section class="controls">
      <input id="searchInput" class="input" placeholder="Search by name, email, phone, department..." />
      <select id="sortSelect" class="select">
        <option value="">Sort: None</option>
        <option value="name-asc">Name A → Z</option>
        <option value="name-desc">Name Z → A</option>
        <option value="salary-desc">Salary High → Low</option>
        <option value="salary-asc">Salary Low → High</option>
        <option value="date-desc">Start Date New → Old</option>
        <option value="date-asc">Start Date Old → New</option>
      </select>
    </section>

    <section id="cardsContainer" class="cards-grid"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
